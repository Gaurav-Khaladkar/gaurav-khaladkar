  <rect x="20" y="24" width="12" height="12" rx="3" fill="#38bdf8" opacity="0.3"/>
  <rect x="20" y="24" width="12" height="12" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="42" y="35" class="subtitle" fill="#38bdf8">FRONTEND</text>
  <line x1="20" y1="52" x2="210" y2="52" stroke="#ffffff" stroke-opacity="0.1"/>

  <g transform="translate(20, 72)">
    <circle cx="8" cy="8" r="4.5" fill="#38bdf8"/>
    <text x="26" y="12" class="item-text">React.js (SPA Architecture)</text>
  </g>
