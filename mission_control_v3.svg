    <rect x="176" y="-15" width="70" height="22" rx="4" fill="#fb923c" fill-opacity="0.15"/>
    <text x="184" y="0" class="mono tag" fill="#fb923c">[Docker]</text>

    <rect x="256" y="-15" width="95" height="22" rx="4" fill="#fb923c" fill-opacity="0.15"/>
    <text x="264" y="0" class="mono tag" fill="#fb923c">[PostgreSQL]</text>

    <rect x="361" y="-15" width="124" height="22" rx="4" fill="#fb923c" fill-opacity="0.15"/>
    <text x="369" y="0" class="mono tag" fill="#fb923c">[GitHub Actions]</text>

    <rect x="495" y="-15" width="94" height="22" rx="4" fill="#fb923c" fill-opacity="0.15"/>
    <text x="503" y="0" class="mono tag" fill="#fb923c">[AWS Cloud]</text>
  </g>
  
  <a href="https://github.com/Gaurav-Khaladkar" target="_blank">
    <g transform="translate(840, 32)">
      <rect width="210" height="42" class="btn-bg"/>
      <text x="105" y="26" class="mono btn-text" text-anchor="middle">View DevOps Spec ↗</text>
      <rect width="210" height="42" rx="6" fill="none" stroke="#38bdf8" filter="url(#mc-softGlow)">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>
  
  <a href="https://github.com/Gaurav-Khaladkar" target="_blank">
    <g transform="translate(840, 92)">
      <rect width="210" height="42" class="btn-bg-alt"/>
      <text x="105" y="26" class="mono btn-text" text-anchor="middle">CI/CD Pipeline ↗</text>
      <rect width="210" height="42" rx="6" fill="none" stroke="#c084fc" filter="url(#mc-softGlow)">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>
</g>

<!-- Bottom HUD Status Bar -->
<path d="M 30 735 L 1170 735" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="60" y="725" class="mono" font-size="12" fill="#94a3b8">OPERATIONAL STATUS // ALL NODES SYNCHRONIZED</text>
<text x="1140" y="725" class="mono" font-size="12" fill="#38BDF8" text-anchor="end">GAURAV KHALADKAR // CORE SYSTEM READY</text>

</g>
</svg>
