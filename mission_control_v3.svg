<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="mc-bgGrad" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#050e1c"/>
    <stop offset="60%" stop-color="#030814"/>
    <stop offset="100%" stop-color="#010307"/>
  </radialGradient>
  <linearGradient id="mc-cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01"/>
  </linearGradient>
  <linearGradient id="mc-btnGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="mc-btnAlt" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0.12"/>
  </linearGradient>
  <filter id="mc-softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="mc-textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  
  <pattern id="mc-grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#22d3ee" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
</defs>

<style>
  .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  .title { font-weight: 800; font-size: 20px; fill: #22d3ee; letter-spacing: 0.8px; }
  .desc { font-weight: 400; font-size: 14.5px; fill: #94a3b8; line-height: 1.5; }
  .tag { font-weight: 600; font-size: 12px; fill: #5eead4; }
  .metric-badge { font-weight: 700; font-size: 11px; fill: #BAE6FD; }
  .btn-text { font-weight: 700; font-size: 12.5px; letter-spacing: 1px; fill: #ffffff; }
  .card-bg { fill: url(#mc-cardGrad); stroke: rgba(34, 211, 238, 0.22); stroke-width: 1.5; rx: 14; }
  .btn-bg { fill: url(#mc-btnGlow); stroke: #38bdf8; stroke-width: 1.2; rx: 6; }
  .btn-bg-alt { fill: url(#mc-btnAlt); stroke: #c084fc; stroke-width: 1.2; rx: 6; }
  
  a { cursor: pointer; outline: none; }
  a:hover .btn-bg { fill: rgba(56, 189, 248, 0.6); }
  a:hover .btn-bg-alt { fill: rgba(192, 132, 252, 0.6); }
  
  .hud { opacity: 0; animation: fadeIn 1.2s ease forwards; animation-delay: 0.3s; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>

<!-- Background -->
<rect width="1200" height="800" fill="url(#mc-bgGrad)"/>
<rect x="-60" y="-60" width="1320" height="920" fill="url(#mc-grid)">
  <animateTransform attributeName="transform" type="translate" values="0,0; -60,60" dur="15s" repeatCount="indefinite" />
</rect>

<!-- Ambient Glowing Orbs -->
<circle cx="160" cy="150" r="300" fill="#38bdf8" opacity="0.12" filter="url(#mc-softGlow)">
  <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="1040" cy="640" r="340" fill="#c084fc" opacity="0.1" filter="url(#mc-softGlow)">
  <animate attributeName="opacity" values="0.05;0.15;0.05" dur="5s" repeatCount="indefinite"/>
</circle>

<g class="hud">

<!-- Main Outer HUD Frame -->
<rect x="30" y="30" width="1140" height="740" rx="20" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="2"/>
<path d="M 30 100 L 1170 100" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="2"/>
<rect x="50" y="30" width="280" height="4" fill="#38bdf8" filter="url(#mc-softGlow)"/>

<text x="60" y="70" class="mono" font-size="20" font-weight="bold" fill="#38bdf8" filter="url(#mc-textGlow)">
  &gt; MISSION_CONTROL // FLAGSHIP_PROJECTS
</text>
<text x="1140" y="70" class="mono" font-size="12" fill="#7C93A8" text-anchor="end">TELEMETRY // ALL SYSTEMS FUNCTIONAL</text>

<!-- ════════════════════════ PROJECT 1: MICROCAMPUS ENTERPRISE LMS ════════════════════════ -->
<g transform="translate(60, 130)">
  <rect width="1080" height="185" class="card-bg"/>
  
  <text x="32" y="44" font-size="24">🎓</text>
  <text x="75" y="42" class="title">MicroCampus — Scalable Academic LMS &amp; RBAC Management API</text>
  
  <text x="75" y="72" class="desc">
    <tspan x="75" dy="0">Production REST API powering campus administrative workflows, course curriculums, and automated quizzes.</tspan>
    <tspan x="75" dy="23">Built with TypeScript, Node.js, Express, MongoDB Mongoose, Multer file handling, and granular JWT RBAC security.</tspan>
  </text>
  
  <!-- Telemetry Metrics Bar for Project 1 -->
  <g transform="translate(75, 122)">
    <rect x="0" y="-12" width="145" height="18" rx="3" fill="#08203e" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="8" y="1" class="mono metric-badge">⚡ LATENCY: &lt; 18ms</text>

    <rect x="155" y="-12" width="165" height="18" rx="3" fill="#08203e" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="163" y="1" class="mono metric-badge">🔍 QUERIES: OPTIMIZED</text>

    <rect x="330" y="-12" width="150" height="18" rx="3" fill="#08203e" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="338" y="1" class="mono metric-badge">🔒 AUTH: JWT TOKEN</text>
  </g>

  <!-- Tags -->
  <g transform="translate(75, 154)">
    <rect x="0" y="-14" width="82" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="8" y="0" class="mono tag">[TypeScript]</text>

    <rect x="92" y="-14" width="98" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="100" y="0" class="mono tag">[Node.js]</text>

    <rect x="200" y="-14" width="88" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="208" y="0" class="mono tag">[Express.js]</text>

    <rect x="298" y="-14" width="82" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="306" y="0" class="mono tag">[MongoDB]</text>

    <rect x="390" y="-14" width="68" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="398" y="0" class="mono tag">[JWT RBAC]</text>

    <rect x="468" y="-14" width="98" height="20" rx="4" fill="#5eead4" fill-opacity="0.1"/>
    <text x="476" y="0" class="mono tag">[Postman Suite]</text>
  </g>
  
  <!-- Action Buttons -->
  <a href="https://github.com/Gaurav-Khaladkar/MicroCampus" target="_blank">
    <g transform="translate(840, 36)">
      <rect width="210" height="44" class="btn-bg"/>
      <text x="105" y="27" class="mono btn-text" text-anchor="middle">View Repository ↗</text>
      <rect width="210" height="44" rx="6" fill="none" stroke="#38bdf8" filter="url(#mc-softGlow)">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>
  
  <a href="https://github.com/Gaurav-Khaladkar/MicroCampus#readme" target="_blank">
    <g transform="translate(840, 100)">
      <rect width="210" height="44" class="btn-bg-alt"/>
      <text x="105" y="27" class="mono btn-text" text-anchor="middle">System Architecture ↗</text>
      <rect width="210" height="44" rx="6" fill="none" stroke="#c084fc" filter="url(#mc-softGlow)">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </a>
</g>

