<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gaurav Khaladkar Terminal &amp; Metrics Dashboard">
  <defs>
    <filter id="softGlow"><feGaussianBlur stdDeviation="15" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M 40 17.321 L 20 5.774 L 0 17.321 L 0 40.415 L 20 51.962 L 40 40.415 Z M 40 51.962 L 20 63.509 L 0 51.962 M 20 5.774 L 20 -5.774 M 20 75.056 L 20 63.509 M 40 17.321 L 60 5.774 M 0 17.321 L -20 5.774 M 40 40.415 L 60 51.962 M 0 40.415 L -20 51.962" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1.5" fill="none"/>
    </pattern>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .term-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 500; }
    .title { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: 2px; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
    .metric-val { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13.5px; font-weight: 800; fill: #E0F2FE; }
    .metric-lbl { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #7C93A8; font-weight: 600; }
  </style>
  
  <rect width="800" height="330" fill="#040910" rx="16" />
  
  <!-- Ambient Glow Orbs -->
  <g filter="url(#softGlow)">
    <circle r="150" fill="#22d3ee" opacity="0.15">
      <animate attributeName="cx" values="100; 700; 100" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50; 270; 50" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle r="120" fill="#c084fc" opacity="0.12">
      <animate attributeName="cx" values="700; 100; 700" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="270; 50; 270" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Background Grids & Frame -->
  <rect width="800" height="330" fill="url(#hexGrid)" rx="16" />
  <rect width="800" height="330" fill="#040910" fill-opacity="0.6" rx="16" />
  <rect width="800" height="330" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2" rx="16" />

  <!-- Terminal Window (Left) -->
  <g transform="translate(20, 20)">
    <rect width="430" height="290" fill="#020408" fill-opacity="0.78" rx="8" stroke="#38bdf8" stroke-opacity="0.32" />
    
    <!-- Terminal Titlebar -->
    <path d="M 0 8 Q 0 0 8 0 L 422 0 Q 430 0 430 8 L 430 30 L 0 30 Z" fill="#0a1322" />
    <circle cx="15" cy="15" r="5" fill="#ef4444" />
    <circle cx="30" cy="15" r="5" fill="#f59e0b" />
    <circle cx="45" cy="15" r="5" fill="#22c55e" />
    <text x="225" y="20" class="term-text" fill="#c9d1d9" text-anchor="middle" font-size="11.5">glacier-os-terminal ~ gaurav-khaladkar</text>
    
    <!-- Animated Typing Sequence -->
    <text x="18" y="55" class="term-text" fill="#38bdf8" opacity="0">
      &gt; SYSTEM_BOOT --profile "Gaurav Khaladkar"
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="0s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="77" class="term-text" fill="#c9d1d9" opacity="0">
      [OK] Full-Stack &amp; AI Agents modules online.
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="1.5s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="99" class="term-text" fill="#38bdf8" opacity="0">
      &gt; LOAD_EXPERIENCE --co "GTL Software Pvt. Ltd."
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="3s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="121" class="term-text" fill="#c9d1d9" opacity="0">
      [OK] React &amp; REST APIs pipeline active.
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="4.5s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="143" class="term-text" fill="#38bdf8" opacity="0">
      &gt; VERIFY_CLEARANCE --oracle "Agentic AI 2026"
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="6s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="165" class="term-text" fill="#c9d1d9" opacity="0">
      [OK] Oracle Certified Foundations verified.
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="7.5s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="187" class="term-text" fill="#38bdf8" opacity="0">
      &gt; session.connect()
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="9s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="209" class="term-text" fill="#c9d1d9" opacity="0">
      Thank you for visiting my GitHub Profile!
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="10.5s" fill="freeze" repeatCount="indefinite" />
    </text>
    <text x="18" y="231" class="term-text" fill="#5eead4" opacity="0">
      Let's build innovative software together 🚀
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="20s" begin="12s" fill="freeze" repeatCount="indefinite" />
    </text>
    
    <!-- Blinking Cursor -->
    <rect x="18" y="252" width="8" height="12" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Neural Telemetry & Metrics (Right) -->
  <g transform="translate(470, 20)">
    <rect width="310" height="290" fill="#020408" fill-opacity="0.65" rx="8" stroke="#38bdf8" stroke-opacity="0.25" />
    
    <text x="18" y="28" class="subtitle">Neural Telemetry Matrix</text>
    <line x1="18" y1="38" x2="292" y2="38" stroke="#38bdf8" stroke-opacity="0.2" />
    
    <!-- Animated Pulsing Sensor Grid -->
    <g transform="translate(15, 33)">
      <circle cx="16" cy="18" r="4.5" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="18" r="4.5" fill="#5eead4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="72" cy="18" r="4.5" fill="#c084fc"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="18" r="4.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="18" r="4.5" fill="#10b981"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="156" cy="18" r="4.5" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Metrics Cards -->
    <g transform="translate(18, 70)">
      <rect width="130" height="52" rx="6" fill="#061224" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="12" y="24" class="metric-val" fill="#38bdf8">99.98%</text>
      <text x="12" y="42" class="metric-lbl">CORE UPTIME</text>
    </g>
    <g transform="translate(160, 70)">
      <rect width="132" height="52" rx="6" fill="#061224" stroke="#5eead4" stroke-opacity="0.3"/>
      <text x="12" y="24" class="metric-val" fill="#5eead4">&lt; 15 ms</text>
      <text x="12" y="42" class="metric-lbl">API LATENCY</text>
    </g>
    <g transform="translate(18, 134)">
      <rect width="130" height="52" rx="6" fill="#061224" stroke="#c084fc" stroke-opacity="0.3"/>
      <text x="12" y="24" class="metric-val" fill="#c084fc">AGENTIC</text>
      <text x="12" y="42" class="metric-lbl">AI ENGINE</text>
    </g>
    <g transform="translate(160, 134)">
      <rect width="132" height="52" rx="6" fill="#061224" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="24" class="metric-val" fill="#34d399">ACTIVE</text>
      <text x="12" y="42" class="metric-lbl">CI/CD PIPELINE</text>
    </g>

    <g transform="translate(18, 198)">
      <rect width="274" height="42" rx="6" fill="#061224" stroke="#818cf8" stroke-opacity="0.3"/>
      <text x="12" y="20" class="metric-val" font-size="12" fill="#BAE6FD">MEM: 512MB // GC HEALTHY</text>
      <text x="12" y="34" class="metric-lbl">JVM RESILIENT EXECUTION</text>
    </g>

    <!-- System Spec Bottom Info -->
    <line x1="18" y1="252" x2="292" y2="252" stroke="#38BDF8" stroke-opacity="0.2"/>
    <text x="18" y="272" class="mono" font-size="11" fill="#38BDF8">STATUS: READY FOR COLLABORATION ⚡</text>
  </g>
</svg>
