<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" width="1500" height="1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fd7ff"/>
      <stop offset="50%" stop-color="#c08bff"/>
      <stop offset="100%" stop-color="#ff8fd0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ea8ff"/>
      <stop offset="50%" stop-color="#b15bff"/>
      <stop offset="100%" stop-color="#2be0c8"/>
    </linearGradient>
    <radialGradient id="bgVignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#123457" stroke-width="1"/>
    </pattern>

    <!-- Symbols -->
    <symbol id="icon-cap" viewBox="-24 -24 48 48">
      <path d="M-22 -4 L0 -14 L22 -4 L0 6 Z" fill="currentColor"/>
      <rect x="-11" y="6" width="22" height="6" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="17" y1="-1" x2="17" y2="14" stroke="currentColor" stroke-width="2"/>
      <circle cx="17" cy="16.5" r="2.6" fill="currentColor"/>
    </symbol>

    <symbol id="icon-medal" viewBox="-24 -24 48 48">
      <path d="M-8 -16 L-3.5 -1 M8 -16 L3.5 -1" stroke="currentColor" stroke-width="2.4" fill="none"/>
      <circle cx="0" cy="3" r="13.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M0 -5 L2.3 0.3 L7.5 0.9 L3.6 4.3 L4.7 9.5 L0 6.8 L-4.7 9.5 L-3.6 4.3 L-7.5 0.9 L-2.3 0.3 Z" fill="currentColor"/>
    </symbol>

    <symbol id="icon-briefcase" viewBox="-24 -24 48 48">
      <rect x="-18" y="-10" width="36" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M-8 -10 V-16 H8 V-10" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <line x1="-18" y1="2" x2="18" y2="2" stroke="currentColor" stroke-width="1.8"/>
      <rect x="-3" y="0" width="6" height="5" rx="1" fill="currentColor"/>
    </symbol>

    <symbol id="icon-building" viewBox="-110 -115 220 220">
      <path d="M-80 -8 L0 -58 L80 -8" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="-72" y="-8" width="144" height="88" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="-16" y="-98" width="32" height="46" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="0" cy="-92" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="-90" y1="80" x2="90" y2="80" stroke="currentColor" stroke-width="2"/>
      <line x1="-98" y1="90" x2="98" y2="90" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <symbol id="icon-trophy" viewBox="-120 -130 240 240">
      <g stroke="currentColor" fill="none" stroke-width="3">
        <path d="M-32 -34 H32 V-10 C32 18 17 34 0 34 C-17 34 -32 18 -32 -10 Z"/>
        <path d="M-32 -28 C-56 -28 -56 8 -30 10"/>
        <path d="M32 -28 C56 -28 56 8 30 10"/>
        <line x1="0" y1="34" x2="0" y2="54"/>
      </g>
      <rect x="-22" y="54" width="44" height="11" rx="2" fill="currentColor" opacity="0.9"/>
      <path d="M0 -70 l3 7 7.5 .8 -5.6 5 1.6 7.4 -6.5 -3.8 -6.5 3.8 1.6 -7.4 -5.6 -5 7.5 -.8 Z" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1500" height="1020" fill="#040810"/>
  <rect width="1500" height="1020" fill="url(#bgVignette)"/>
  <rect width="1500" height="1020" fill="url(#gridPattern)" opacity="0.35"/>

  <!-- Corner Brackets -->
  <g stroke="#2a7fa8" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M18 70 L18 18 L70 18"/>
    <path d="M1482 70 L1482 18 L1430 18"/>
    <path d="M18 950 L18 1002 L70 1002"/>
    <path d="M1482 950 L1482 1002 L1430 1002"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(120,112)">
    <circle r="68" fill="none" stroke="#2ea8ff" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="none" stroke="#6fd7ff" stroke-width="2" opacity="0.85"/>
    <circle r="38" fill="#081428" stroke="#6fd7ff" stroke-width="2.4"/>
    <use href="#icon-cap" x="-22" y="-22" width="44" height="44" style="color:#bfe8ff"/>
  </g>

  <text x="210" y="97" font-size="52" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">ACADEMIC &amp; WORK TIMELINE</text>
  <text x="213" y="130" font-size="15" letter-spacing="3" fill="#8fd0ff" font-family="Consolas, monospace">&#8592; GAURAV KHALADKAR // TRACK RECORD PROTOCOL &#8594;</text>

  <!-- SCANNING WIDGET -->
  <text x="1150" y="66" font-size="16" letter-spacing="2" fill="#8fe6ff" font-family="Consolas, monospace">VERIFYING RECORDS....</text>
  <rect x="1150" y="80" width="230" height="10" rx="5" fill="none" stroke="#2ea8ff" stroke-width="1.5"/>
  <rect x="1153" y="82.5" width="224" height="5" rx="2.5" fill="#6fe3ff">
    <animate attributeName="width" values="0;224;224;0" keyTimes="0;0.55;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="1400" y="93" font-size="15" fill="#eaf6ff" font-family="Consolas, monospace">100%</text>

  <!-- TIMELINE CONNECTOR LINE -->
  <line x1="215" y1="220" x2="215" y2="860" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- ═════════════════════ NODE 1 : M.C.S. (Blue) ═════════════════════ -->
  <g>
    <circle cx="215" cy="285" r="44" fill="none" stroke="#2ea8ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="40;49;40" dur="2.4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.4s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="215" cy="285" r="34" fill="#050c18" stroke="#2ea8ff" stroke-width="2.6"/>
    <use href="#icon-cap" x="193" y="263" width="44" height="44" style="color:#bfe4ff"/>
    <line x1="241" y1="285" x2="470" y2="285" stroke="#2ea8ff" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
    <rect x="346" y="281" width="8" height="8" fill="#2ea8ff" opacity="0.9" transform="rotate(45 350 285)"/>
  </g>

  <g transform="translate(470, 185)">
    <rect width="860" height="200" rx="14" fill="#081120" fill-opacity="0.94" stroke="#2ea8ff" stroke-width="1.6" filter="url(#glow)"/>
    <path d="M820 10 L840 10 M830 10 L850 30" stroke="#6fd7ff" stroke-width="2" opacity="0.8"/>

    <text x="35" y="44" font-size="24" font-weight="700" fill="#f2f8ff">MASTER OF COMPUTER SCIENCE (M.C.S.)</text>
    <text x="35" y="70" font-size="16.5" fill="#b9d9ff">Savitribai Phule Pune University (SPPU)</text>

    <!-- Period Badge -->
    <rect x="35" y="95" width="130" height="34" rx="6" fill="#08192f" stroke="#2ea8ff" stroke-width="1.3"/>
    <text x="50" y="117" font-size="14.5" font-weight="700" fill="#9fd3ff">2022 – 2024</text>

    <!-- Honors Badge -->
    <rect x="180" y="95" width="220" height="34" rx="6" fill="#08192f" stroke="#5eead4" stroke-width="1.3"/>
    <text x="195" y="117" font-size="14" font-weight="700" fill="#5eead4">Post-Graduate Degree</text>

    <!-- Details -->
    <text x="35" y="160" font-size="14.5" fill="#94a3b8">
      Key Focus: Advanced Web Architecture, Full-Stack Development, Spring Boot &amp; Agentic AI Systems.
    </text>

    <use href="#icon-building" x="650" y="-10" width="200" height="200" style="color:#3fa8ff" opacity="0.5"/>
  </g>

  <!-- ═════════════════════ NODE 2 : B.C.S. (Purple) ═════════════════════ -->
  <g>
    <circle cx="215" cy="525" r="44" fill="none" stroke="#b15bff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="40;49;40" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="215" cy="525" r="34" fill="#0c0818" stroke="#b15bff" stroke-width="2.6"/>
    <use href="#icon-medal" x="193" y="503" width="44" height="44" style="color:#ecc7ff"/>
    <line x1="241" y1="525" x2="470" y2="525" stroke="#b15bff" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
    <rect x="346" y="521" width="8" height="8" fill="#b15bff" opacity="0.9" transform="rotate(45 350 525)"/>
  </g>

  <g transform="translate(470, 425)">
    <rect width="860" height="200" rx="14" fill="#120c22" fill-opacity="0.94" stroke="#b15bff" stroke-width="1.6" filter="url(#glow)"/>
    <path d="M820 10 L840 10 M830 10 L850 30" stroke="#e79bff" stroke-width="2" opacity="0.8"/>

    <text x="35" y="44" font-size="24" font-weight="700" fill="#f6ecff">BACHELOR OF COMPUTER SCIENCE (B.C.S.)</text>
    <text x="35" y="70" font-size="16.5" fill="#d9c2ff">H.V. Desai College, Savitribai Phule Pune University</text>

    <!-- Period Badge -->
    <rect x="35" y="95" width="130" height="34" rx="6" fill="#190f2c" stroke="#b15bff" stroke-width="1.3"/>
    <text x="50" y="117" font-size="14.5" font-weight="700" fill="#d3a8ff">2019 – 2022</text>

    <!-- Degree Badge -->
    <rect x="180" y="95" width="220" height="34" rx="6" fill="#190f2c" stroke="#ff6bcf" stroke-width="1.3"/>
    <text x="195" y="117" font-size="14" font-weight="700" fill="#ffb3ea">Undergraduate Degree</text>

    <text x="35" y="160" font-size="14.5" fill="#94a3b8">
      Key Focus: Object-Oriented Programming (Java), Data Structures &amp; Algorithms, Relational SQL Databases.
    </text>

    <use href="#icon-trophy" x="650" y="-10" width="200" height="200" style="color:#c56bff" opacity="0.5"/>
  </g>

  <!-- ═════════════════════ NODE 3 : GTL SOFTWARE EXPERIENCE (Teal) ═════════════════════ -->
  <g>
    <circle cx="215" cy="765" r="44" fill="none" stroke="#2be0c8" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="40;49;40" dur="2.4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="215" cy="765" r="34" fill="#051815" stroke="#2be0c8" stroke-width="2.6"/>
    <use href="#icon-briefcase" x="193" y="743" width="44" height="44" style="color:#b6fff2"/>
    <line x1="241" y1="765" x2="470" y2="765" stroke="#2be0c8" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
    <rect x="346" y="761" width="8" height="8" fill="#2be0c8" opacity="0.9" transform="rotate(45 350 765)"/>
  </g>

  <g transform="translate(470, 665)">
    <rect width="860" height="200" rx="14" fill="#071f1c" fill-opacity="0.94" stroke="#2be0c8" stroke-width="1.6" filter="url(#glow)"/>
    <path d="M820 10 L840 10 M830 10 L850 30" stroke="#7fffe0" stroke-width="2" opacity="0.8"/>

    <text x="35" y="44" font-size="24" font-weight="700" fill="#eefffb">SOFTWARE DEVELOPER // INDUSTRY EXPERIENCE</text>
    <text x="35" y="70" font-size="16.5" fill="#9effeb">GTL Software Pvt. Ltd., Pune, Maharashtra</text>

    <!-- Period Badge -->
    <rect x="35" y="95" width="200" height="34" rx="6" fill="#0c2b27" stroke="#2be0c8" stroke-width="1.3"/>
    <text x="50" y="117" font-size="14.5" font-weight="700" fill="#7fffe0">Jan 2024 – Jun 2024</text>

    <!-- Role Badge -->
    <rect x="250" y="95" width="200" height="34" rx="6" fill="#0c2b27" stroke="#5eead4" stroke-width="1.3"/>
    <text x="265" y="117" font-size="14" font-weight="700" fill="#5eead4">Agile Engineering Sprint</text>

    <text x="35" y="152" font-size="14.5" fill="#94a3b8">
      • Built &amp; configured frontend features from business requirements using JavaScript &amp; modern web technologies.
    </text>
    <text x="35" y="174" font-size="14.5" fill="#94a3b8">
      • Integrated REST APIs over HTTP/HTTPS, consumed backend services, and rendered dynamic data with error handling.
    </text>
  </g>

</svg>
